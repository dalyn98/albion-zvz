name: Killboard sync

# 킬보드 sync cron. GitHub Actions 스케줄로 15분마다 /api/cron/killboard-sync
# 엔드포인트를 호출한다. 엔드포인트 내부에서 게이트 없이 모든 활성 테넌트에
# 대해 sync 를 실행. (과거엔 이벤트 중 5분 / 평시 1시간 분기였으나
# battle-tracker 와 동일한 15분 tick 으로 단순화.)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: killboard-sync
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call cron endpoint
        env:
          APP_URL: https://albion-zvz.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/killboard-sync")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "status=$status"
          echo "body=$body"
          if [ "$status" != "200" ]; then
            exit 1
          fi
