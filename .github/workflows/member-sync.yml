name: Member sync

# 하루 1회 Discord 길드 멤버 목록을 확인해 사이트 멤버의 탈퇴 상태를 갱신한다.
# 길드원 활동이 가장 적은 KST 04:00 (= UTC 19:00 전날) 에 실행하도록 스케줄.
# Actions 공용 러너 지연은 하루 1회 수렴 로직에 영향을 주지 않는다.

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

concurrency:
  group: member-sync
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call cron endpoint
        env:
          APP_URL: https://albion-zvz.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/member-sync")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "status=$status"
          echo "body=$body"
          if [ "$status" != "200" ]; then
            exit 1
          fi
