name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # These job IDs are an external contract: Vercel Deployment Checks block
  # production alias assignment until unit, integration, and migration-drift
  # all report success for the exact commit being deployed.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: TypeScript check
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests and coverage floor
        run: npm run test:coverage

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ github.sha }}
          path: coverage
          if-no-files-found: warn
          retention-days: 14

      - name: Production build
        if: ${{ !cancelled() }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.109.0

      - name: Start fresh local Supabase
        run: |
          supabase start
          supabase db reset
          supabase status -o env > supabase.env
          set -a
          . ./supabase.env
          set +a
          if [ -z "${API_URL:-}" ] || [ -z "${ANON_KEY:-}" ] || [ -z "${SERVICE_ROLE_KEY:-}" ]; then
            echo "Local Supabase status did not expose API_URL, ANON_KEY, or SERVICE_ROLE_KEY" >&2
            exit 1
          fi
          echo "TEST_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_SERVICE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "ALLOW_REMOTE_TEST_SUPABASE=0" >> "$GITHUB_ENV"
          echo "COOKIE_SECRET=ci-cookie-secret-for-auth-smoke-tests" >> "$GITHUB_ENV"
          echo "COOKIE_SECURE=false" >> "$GITHUB_ENV"
          echo "ENABLE_TEST_AUTH=true" >> "$GITHUB_ENV"
          echo "TEST_AUTH_SECRET=ci-test-auth-secret-1234567890" >> "$GITHUB_ENV"

      - name: Strict integration tests
        run: npm run test:integration:required

      - name: Install browser matrix
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build and start authenticated test application
        id: authenticated-app
        run: |
          set -a
          . ./supabase.env
          set +a
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export NODE_OPTIONS=--max-old-space-size=4096
          export VERCEL_ENV=preview

          mkdir -p artifacts/browser-smoke
          npm run build > artifacts/browser-smoke/runtime.log 2>&1
          npm run start >> artifacts/browser-smoke/runtime.log 2>&1 &
          app_pid=$!
          echo "$app_pid" > /tmp/albion-app.pid

          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:3000/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            tail -200 artifacts/browser-smoke/runtime.log
            exit 1
          fi

      - name: Create authenticated browser fixtures
        id: auth-fixtures
        if: ${{ !cancelled() && steps.authenticated-app.outcome == 'success' }}
        run: |
          npm run smoke:create-test-auth -- \
            --base-url http://localhost:3000 \
            --output-dir artifacts/test-auth

      - name: Public and demo route smoke
        if: ${{ !cancelled() && steps.authenticated-app.outcome == 'success' && steps.auth-fixtures.outcome == 'success' }}
        run: |
          npm run smoke:browser -- \
            --base-url http://localhost:3000 \
            --groups public,demo \
            --capture-screenshots \
            --output artifacts/browser-smoke/public-demo-ci.md

      - name: Member desktop route smoke
        if: ${{ !cancelled() && steps.authenticated-app.outcome == 'success' && steps.auth-fixtures.outcome == 'success' }}
        run: |
          npm run smoke:browser -- \
            --base-url http://localhost:3000 \
            --groups member \
            --member-storage-state artifacts/test-auth/member.json \
            --capture-screenshots \
            --output artifacts/browser-smoke/member-ci.md

      - name: Admin desktop route smoke
        if: ${{ !cancelled() && steps.authenticated-app.outcome == 'success' && steps.auth-fixtures.outcome == 'success' }}
        run: |
          npm run smoke:browser -- \
            --base-url http://localhost:3000 \
            --groups admin \
            --admin-storage-state artifacts/test-auth/admin.json \
            --capture-screenshots \
            --output artifacts/browser-smoke/admin-ci.md

      - name: Full mobile layout smoke
        if: ${{ !cancelled() && steps.authenticated-app.outcome == 'success' && steps.auth-fixtures.outcome == 'success' }}
        run: |
          npm run smoke:browser -- \
            --base-url http://localhost:3000 \
            --groups public,demo,member,admin \
            --member-storage-state artifacts/test-auth/member.json \
            --admin-storage-state artifacts/test-auth/admin.json \
            --mobile \
            --layout-contract \
            --output artifacts/browser-smoke/mobile-ci.md

      - name: Core write-flow smoke
        if: ${{ !cancelled() && steps.authenticated-app.outcome == 'success' && steps.auth-fixtures.outcome == 'success' }}
        run: |
          npm run smoke:slot-workspace -- \
            --base-url http://localhost:3000 \
            --storage-state artifacts/test-auth/admin.json

      - name: Cross-browser and accessibility matrix
        if: ${{ !cancelled() && steps.authenticated-app.outcome == 'success' && steps.auth-fixtures.outcome == 'success' }}
        run: |
          npm run smoke:browser-matrix -- \
            --base-url http://localhost:3000 \
            --member-storage-state artifacts/test-auth/member.json \
            --admin-storage-state artifacts/test-auth/admin.json \
            --output artifacts/browser-matrix/ci.md \
            --screenshot-dir artifacts/browser-matrix/screenshots

      - name: Stop test application
        if: always()
        run: |
          if [ -f /tmp/albion-app.pid ]; then
            kill "$(cat /tmp/albion-app.pid)" 2>/dev/null || true
          fi

      - name: Upload browser and runtime evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            artifacts/browser-smoke
            artifacts/browser-matrix
          if-no-files-found: warn
          retention-days: 14

  migration-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check Supabase secret configuration
        id: supabase-secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must be configured"
            exit 1
          fi

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.109.0

      - name: Check remote migration drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: scripts/check-supabase-migration-drift.sh
