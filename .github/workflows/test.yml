name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: 2.104.0

      - name: Start local Supabase
        run: |
          supabase start
          supabase db reset
          supabase status -o env > supabase.env
          set -a
          . ./supabase.env
          set +a
          if [ -z "${API_URL:-}" ] || [ -z "${ANON_KEY:-}" ] || [ -z "${SERVICE_ROLE_KEY:-}" ]; then
            echo "Local Supabase status did not expose API_URL, ANON_KEY, or SERVICE_ROLE_KEY" >&2
            exit 1
          fi
          echo "TEST_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_SERVICE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "ALLOW_REMOTE_TEST_SUPABASE=0" >> "$GITHUB_ENV"
          echo "COOKIE_SECRET=ci-cookie-secret-for-auth-smoke-tests" >> "$GITHUB_ENV"
          echo "COOKIE_SECURE=false" >> "$GITHUB_ENV"
          echo "ENABLE_TEST_AUTH=true" >> "$GITHUB_ENV"
          echo "TEST_AUTH_SECRET=ci-test-auth-secret-1234567890" >> "$GITHUB_ENV"

      - name: Integration tests
        run: npm run test:integration

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Authenticated browser smoke
        run: |
          set -a
          . ./supabase.env
          set +a
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"

          npm run dev > /tmp/albion-next-dev.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:3000/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            tail -200 /tmp/albion-next-dev.log
            exit 1
          fi

          npm run smoke:create-test-auth -- \
            --base-url http://localhost:3000 \
            --output-dir artifacts/test-auth

          if ! npm run smoke:browser -- \
            --base-url http://localhost:3000 \
            --groups member,admin \
            --member-storage-state artifacts/test-auth/member.json \
            --admin-storage-state artifacts/test-auth/admin.json \
            --settle-ms 1000 \
            --output artifacts/browser-smoke/authenticated-ci.md; then
            tail -200 /tmp/albion-next-dev.log
            exit 1
          fi

  migration-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Check Supabase secret configuration
        id: supabase-secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF secrets are not configured; skipping remote migration drift check"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v3
        if: steps.supabase-secrets.outputs.skip != 'true'
        with:
          version: 2.104.0

      - name: Check remote migration drift
        if: steps.supabase-secrets.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: scripts/check-supabase-migration-drift.sh
